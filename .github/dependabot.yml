version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
        exclude-patterns: ["github.com/sagernet/*"]
    # sing-box is pinned by docs/CONTRACT.md; only take patch releases.
    ignore:
      - dependency-name: github.com/sagernet/sing-box
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
