name: Ошибка в Melsi
description: Помогите воспроизвести проблему с клиентом
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за обратную связь. Не отправляйте ссылки подписок, UUID, пароли и резервные копии. Перед публикацией проверьте журнал: он может содержать адреса серверов и другие личные данные.
  - type: input
    id: version
    attributes:
      label: Версия Melsi
      description: Настройки → О программе
      placeholder: 1.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      options:
        - Android
        - iOS
        - macOS — Apple Silicon
        - macOS — Intel
        - Windows x64
        - Linux x64
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Версия системы и устройство
      placeholder: Версия ОС, модель устройства или дистрибутив
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      description: Что сделали, чего ожидали и что произошло вместо этого?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика или скриншот
      description: Необязательно. Только после удаления личных данных и секретов.
  - type: checkboxes
    id: privacy
    attributes:
      label: Перед отправкой
      options:
        - label: Я удалил пароли, UUID, ссылки подписок и другие секреты из сообщения и вложений.
          required: true
