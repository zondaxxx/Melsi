name: melsi
description: "Melsi — a fast, beautiful cross-platform VPN client on sing-box."
publish_to: 'none'

version: 1.1.7+13

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  yaml: ^3.1.4
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.2
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  file_selector: ^1.1.0
  share_plus: ^13.3.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Liberation Mono
      fonts:
        - asset: assets/fonts/LiberationMono-Regular.ttf
        - asset: assets/fonts/LiberationMono-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/OFL.txt
    - assets/rulesets/
    - assets/map/countries.json
